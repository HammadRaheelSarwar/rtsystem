services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports: ["27017:27017"]
    volumes: [mongo_data:/data/db]
  server:
    build: ./server
    restart: unless-stopped
    env_file: .env
    ports: ["5000:5000"]
    volumes: [./uploads:/app/uploads]
    depends_on: [mongo]
  client:
    build: ./client
    restart: unless-stopped
    ports: ["8080:80"]
    depends_on: [server]
volumes:
  mongo_data:
